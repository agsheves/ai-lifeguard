ai_lifeguard:
  mode: production

  allowed_domains:
    - "api.openai.com"
    - "api.anthropic.com"

  trusted_mcps:
    - name: "filesystem"
      publisher: "anthropic"

  orchestrator:
    max_workers: 4
    routing:
      command: serial
      file_access: serial
      prompt: parallel
      endpoint: parallel
      mcp: parallel
      dependency: parallel
    severity_map:
      low: log
      medium: alert
      high: isolate
      critical: kill

  cve_feed_url: "https://cve.now/feed?format=json"

  semgrep:
    registry: true
    timeout: 600

  sonar:
    host_url: "https://sonarcloud.io"
    project_key: "agsheves_ai-lifeguard"
    token_env: SONAR_TOKEN
