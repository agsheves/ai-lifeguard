name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e .[yaml] pytest
      - run: pytest -q

  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep (bundled pack + registry)
        run: >
          semgrep scan
          --config src/ai_lifeguard/defaults/semgrep_rules.yaml
          --config p/python --config p/default
          --metrics=off --error --sarif-output=semgrep.sarif src/
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif

  lifeguard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e .[sast]
      - name: Dogfood SAST on our own source
        run: ai-lifeguard scan --dir src --sast --fail-on high
      - name: Dependencies vs cve.now feed
        run: ai-lifeguard scan --dir . --deps --fail-on high

  sonar:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: SonarQube scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      - name: Skipped
        if: env.SONAR_TOKEN == ''
        run: echo "SONAR_TOKEN not set; Sonar skipped until AL-001 is done." >> "$GITHUB_STEP_SUMMARY"
